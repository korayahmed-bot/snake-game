<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan Oyunu</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        #game {
            background: #222;
            border: 3px solid #4caf50;
            margin-top: 10px;
        }

        .info {
            font-size: 20px;
            margin: 10px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        #restart {
            background: #4caf50;
            color: white;
        }

        #sound {
            background: #555;
            color: white;
        }

        .controls button {
            width: 60px;
            height: 45px;
            font-size: 22px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<h1>🐍 Yılan Oyunu</h1>

<div class="info">
    🍎 Skor: <span id="score">0</span>
    &nbsp;&nbsp;
    🏆 En iyi: <span id="best">0</span>
    &nbsp;&nbsp;
    ❤️ Can: <span id="lives">3</span>
</div>

<canvas id="game" width="500" height="500"></canvas>

<br>

<button id="restart">🔄 Yeniden Başlat</button>
<button id="sound">🔊 Ses Açık</button>

<div class="controls">
    <div>
        <button onclick="changeDirection('up')">⬆️</button>
    </div>
    <div>
        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const box = 25;
    const rows = canvas.width / box;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let lives;
    let gameOver;
    let gameLoop;

    // Daha büyük sayı = daha yavaş oyun
    let speed = 300;

    let soundOn = true;

    let bestScore = localStorage.getItem("snakeBest") || 0;
    document.getElementById("best").textContent = bestScore;

    function startGame() {
        snake = [
            { x: 10 * box, y: 10 * box },
            { x: 9 * box, y: 10 * box },
            { x: 8 * box, y: 10 * box }
        ];

        direction = "right";
        nextDirection = "right";
        score = 0;
        lives = 3;
        gameOver = false;

        document.getElementById("score").textContent = score;
        document.getElementById("lives").textContent = lives;

        createFood();

        clearInterval(gameLoop);
        gameLoop = setInterval(update, speed);

        draw();
    }

    function createFood() {
        do {
            food = {
                x: Math.floor(Math.random() * rows) * box,
                y: Math.floor(Math.random() * rows) * box
            };
        } while (
            snake.some(part => part.x === food.x && part.y === food.y)
            );
    }

    function draw() {
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Izgara
        ctx.strokeStyle = "#333";

        for (let i = 0; i < rows; i++) {
            ctx.beginPath();
            ctx.moveTo(i * box, 0);
            ctx.lineTo(i * box, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i * box);
            ctx.lineTo(canvas.width, i * box);
            ctx.stroke();
        }

        // Yemek
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(
            food.x + box / 2,
            food.y + box / 2,
            box / 2 - 3,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // Yılan
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#7CFF4F" : "#4caf50";

            ctx.fillRect(
                part.x + 2,
                part.y + 2,
                box - 4,
                box - 4
            );
        });
    }

    function update() {
        if (gameOver) return;

        direction = nextDirection;

        const head = {
            x: snake[0].x,
            y: snake[0].y
        };

        if (direction === "up") {
            head.y -= box;
        }

        if (direction === "down") {
            head.y += box;
        }

        if (direction === "left") {
            head.x -= box;
        }

        if (direction === "right") {
            head.x += box;
        }

        // Duvara çarpma
        if (
            head.x < 0 ||
            head.x >= canvas.width ||
            head.y < 0 ||
            head.y >= canvas.height
        ) {
            loseLife();
            return;
        }

        // Kendine çarpma
        if (
            snake.some(
                part => part.x === head.x && part.y === head.y
            )
        ) {
            loseLife();
            return;
        }

        snake.unshift(head);

        // Yemek yendi
        if (head.x === food.x && head.y === food.y) {
            score++;

            document.getElementById("score").textContent = score;

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("snakeBest", bestScore);
                document.getElementById("best").textContent = bestScore;
            }

            createFood();

            // Her 5 puanda biraz hızlanır
            if (score % 5 === 0 && speed > 120) {
                speed -= 15;

                clearInterval(gameLoop);
                gameLoop = setInterval(update, speed);
            }

        } else {
            snake.pop();
        }

        draw();
    }

    function loseLife() {
        lives--;

        document.getElementById("lives").textContent = lives;

        if (lives <= 0) {
            gameOver = true;

            clearInterval(gameLoop);

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "35px Arial";
            ctx.textAlign = "center";
            ctx.fillText(
                "OYUN BİTTİ!",
                canvas.width / 2,
                canvas.height / 2
            );
        } else {
            snake = [
                { x: 10 * box, y: 10 * box },
                { x: 9 * box, y: 10 * box },
                { x: 8 * box, y: 10 * box }
            ];

            direction = "right";
            nextDirection = "right";

            createFood();
            draw();
        }
    }

    function changeDirection(newDirection) {
        if (newDirection === "up" && direction !== "down") {
            nextDirection = "up";
        }

        if (newDirection === "down" && direction !== "up") {
            nextDirection = "down";
        }

        if (newDirection === "left" && direction !== "right") {
            nextDirection = "left";
        }

        if (newDirection === "right" && direction !== "left") {
            nextDirection = "right";
        }
    }

    document.addEventListener("keydown", function(event) {

        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "z"
        ) {
            changeDirection("up");
        }

        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {
            changeDirection("down");
        }

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "q"
        ) {
            changeDirection("left");
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {
            changeDirection("right");
        }
    });

    document.getElementById("restart").addEventListener(
        "click",
        startGame
    );

    document.getElementById("sound").addEventListener(
        "click",
        function() {
            soundOn = !soundOn;

            this.textContent = soundOn
                ? "🔊 Ses Açık"
                : "🔇 Ses Kapalı";
        }
    );

    startGame();
</script>

</body>
</html>
